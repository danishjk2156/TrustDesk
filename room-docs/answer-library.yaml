    control: storage_public_access_blocked
    evidence: ["acmecloud/terraform/s3.tf:51  block_public_acls       = true", "acmecloud/terraform/s3.tf:52  block_public_policy     = true", "acmecloud/terraform/s3.tf:53  ignore_public_acls      = true", "acmecloud/terraform/s3.tf:54  restrict_public_buckets = true", "acmecloud/terraform/s3.tf:59  block_public_acls       = true", "acmecloud/terraform/s3.tf:60  block_public_policy     = true", "acmecloud/terraform/s3.tf:61  ignore_public_acls      = true", "acmecloud/terraform/s3.tf:62  restrict_public_buckets = true", "acmecloud/terraform/s3.tf:67  block_public_acls       = true", "acmecloud/terraform/s3.tf:68  block_public_policy     = true", "acmecloud/terraform/s3.tf:69  ignore_public_acls      = true", "acmecloud/terraform/s3.tf:70  restrict_public_buckets = true"]
    approved_by: security-lead
