name: drift
# Re-prove every approved library answer whenever the product code or the library changes.
on:
  push:
    branches: [main]
    paths: ["acmecloud/**", "room-docs/answer-library.yaml", "agents/evidence/search.py"]
  pull_request:
    paths: ["acmecloud/**", "room-docs/answer-library.yaml", "agents/evidence/search.py"]

permissions: {}  # each job asks for exactly what it needs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Re-prove approved answers against this commit
        run: |
          set +e
          python tools/drift_watch.py --markdown > drift.md
          status=$?
          cat drift.md
          { echo '```'; cat drift.md; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ $status -eq 1 ]; then echo "::error::TrustDesk drift: approved answers are STALE; re-approve before reuse"; fi
          exit $status
