name: tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Evidence engine and release gate
        run: python -m unittest discover -s tests -v
      - name: Release blockers (false-positive VERIFIED, unauthorized approval)
        run: python -m unittest discover -s tests -p "test_adv_*.py" -v
      - name: Sample questionnaire is reproducible
        run: |
          python tools/make_sample.py
          git diff --exit-code -- tests/answer_key.json
