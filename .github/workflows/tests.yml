name: tests
on:
  push:
    branches: [main]
  pull_request:

permissions: {}  # each job asks for exactly what it needs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Evidence engine and release gate
        run: python -m unittest discover -s tests -v
      - name: Release blockers (false-positive VERIFIED, unauthorized approval)
        run: python -m unittest discover -s tests -p "test_adv_*.py" -v
      - name: Sample questionnaire is reproducible
        run: |
          python tools/make_sample.py
          git diff --exit-code -- tests/answer_key.json
